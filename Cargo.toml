[package]
name = "screendiffai"
version = "1.1.1"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Screenshot pixel diff engine — detect visual regressions between images"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustScreenDiffAI"
readme = "README.md"
keywords = ["screenshot", "diff", "visual", "testing", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "screendiff"
path = "src/lib.rs"

[[bin]]
name = "screendiffai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
colored = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
image = "0.25"
